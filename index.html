<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>나의 병동 운동</title>
<style>
:root{--bg:#F1F4EF;--panel:#fff;--ink:#16211C;--sub:#54625A;--line:#D7DED5;--pri:#2D6A4F;--pri-soft:#E2EEE6;--amber:#B7791F;--amber-soft:#FBF2DF;--danger:#B23A48;
--c-sh:#2F5F98;--c-el:#3E73AE;--c-wr:#4F86BF;--c-gr:#5E97C9;--c-fi:#6FA6D2;--c-hip:#4E7D32;--c-kn:#5E8C3E;--c-an:#739F52;--c-trunk:#7D5BA6;--c-bal:#C06C21;--c-gen:#3F8A87;
--c-face:#D0566F;--c-oral:#C2405A;--c-phar:#9E2F45;--c-cog:#B08900;--c-lang:#2F7D74;--c-adl:#8A6D3B;--c-mood:#A0527A}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:"Pretendard","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;background:var(--bg);color:var(--ink);font-size:17px;line-height:1.55;padding-bottom:40px}
header{background:var(--pri);color:#fff;padding:16px 18px}
header h1{margin:0;font-size:22px;letter-spacing:-.4px}
header .who{font-size:15px;opacity:.9;margin-top:4px}
main{max-width:640px;margin:0 auto;padding:16px}
.safety{background:var(--amber-soft);border:2px solid #E7C98A;border-radius:12px;padding:12px 14px;font-weight:700;font-size:17px;margin-bottom:14px}
.safety small{display:block;font-weight:400;font-size:14.5px;color:#6B4A10;margin-top:4px}
.progress{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:14px}
.progress b{font-size:18px}
.bar{height:12px;border-radius:8px;background:var(--bg);overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%;background:var(--pri);width:0;transition:width .3s}
.card{background:#fff;border:1px solid var(--line);border-left:7px solid var(--c);border-radius:14px;padding:14px 16px;margin-bottom:12px}
.card.done{background:#F3F8F4;border-color:#BBD8C6}
.card h2{margin:0;font-size:20px;line-height:1.3;display:flex;gap:10px;align-items:flex-start}
.card h2 svg{flex:none}
.meta{font-size:14px;color:var(--sub);margin:2px 0 8px}
.meta b.k1{color:#1F3B2F}.meta b.k2{color:#2F7D74}
.dose{display:inline-block;background:var(--pri-soft);color:var(--pri);font-weight:700;border-radius:8px;padding:3px 10px;font-size:16px;margin-bottom:8px}
ol{margin:6px 0 0;padding-left:22px}
li{margin-bottom:4px}
.cau{background:#FBEFEA;color:#8A4B0C;border-radius:8px;padding:8px 10px;font-size:15px;margin-top:8px}
.carer{display:inline-block;background:var(--amber-soft);color:#6B4A10;border-radius:8px;padding:2px 9px;font-size:14px;font-weight:700;margin-top:8px}
.acts{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:#fff;border-radius:10px;padding:11px 16px;font:inherit;cursor:pointer;min-height:48px}
.btn.done{background:var(--pri);border-color:var(--pri);color:#fff;font-weight:700;flex:1}
.btn.undone{background:#fff;color:var(--pri);border-color:var(--pri);font-weight:700;flex:1}
.btn.vid{color:var(--pri)}
.edu{background:#fff;border:1px solid var(--line);border-left:7px solid var(--c-adl);border-radius:14px;padding:14px 16px;margin-bottom:12px}
.edu h2{margin:0 0 6px;font-size:19px}
.edu .role{background:var(--pri-soft);border-radius:8px;padding:8px 10px;font-size:15px;margin-top:8px}
.edu .avoid{background:#FBEAEC;border-radius:8px;padding:8px 10px;font-size:15px;margin-top:6px}
.meal{background:#fff;border:2px dashed var(--c-phar);border-radius:12px;padding:12px 14px;margin-bottom:14px}
.meal b{color:var(--c-phar)}
h3.sec{font-size:15px;color:var(--sub);margin:22px 0 8px}
.stop{background:#FBEAEC;border-radius:12px;padding:12px 14px;font-weight:700;margin-top:18px}
.empty{background:#fff;border:1px solid var(--line);border-radius:12px;padding:24px;text-align:center;color:var(--sub)}
.week{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
.week span{flex:1;min-width:38px;text-align:center;border:1px solid var(--line);border-radius:8px;padding:6px 0;font-size:14px;background:#fff}
.week span.on{background:var(--pri);color:#fff;border-color:var(--pri);font-weight:700}
.week span.today{outline:2px solid var(--amber)}
footer{max-width:640px;margin:0 auto;padding:0 16px;color:var(--sub);font-size:13.5px}
</style>
</head>
<body>
<header><h1>나의 병동 운동</h1><div class="who" id="who"></div></header>
<main id="main"></main>
<footer id="foot"></footer>

  let h=`<div class="safety">${esc(data.t||"아프지 않은 범위에서만 하세요.")}<small>통증, 어지러움, 숨참, 사레가 생기면 바로 멈추고 간호사에게 알리세요.</small></div>`;
  h+=`<div class="progress"><b>오늘 ${doneN} / ${ex.length}개 완료</b><div class="bar"><i style="width:${ex.length?Math.round(doneN/ex.length*100):0}%"></i></div>
    <div class="week">${wk.map((d,i)=>{const l=log[d]||{};const n=ex.filter(o=>l[o.e.id]).length;
      return `<span class="${n&&n===ex.length?"on":""} ${d===today()?"today":""}">${names[i]}<br>${n?n+"개":"–"}</span>`;}).join("")}</div>
    <div style="font-size:14px;color:var(--sub);margin-top:8px">일요일은 쉬어요. 운동을 마치면 아래에서 '했어요'를 눌러 주세요.</div></div>`;
  if(data.m)h+=`<div class="meal"><b>식사할 때 지킬 것</b><div style="white-space:pre-wrap">${esc(data.m)}</div></div>`;
  if(ex.length)h+=`<h3 class="sec">오늘 할 운동 ${ex.length}개</h3>`;
  h+=ex.map(({e,dose})=>{const c=`var(--c-${e.dom})`,done=isDone(e.id);
    return `<div class="card ${done?"done":""}" style="--c:${c}">
      <h2>${bodySvg(BODY[e.dom],c,34)}<span>${esc(e.name)}</span></h2>
      <div class="meta">${e.kind?`<b class="${e.kind==="근력"?"k1":"k2"}">${e.kind}</b> · `:""}${DOMN[e.dom]||""} · ${POS[e.pos]||""}</div>
      <span class="dose">${esc(dose||e.dose)}</span>
      <ol>${e.steps.map(s=>`<li>${esc(s)}</li>`).join("")}</ol>
      ${e.caution?`<div class="cau">${esc(e.caution)}</div>`:""}
      ${e.carer?`<div class="carer">보호자와 함께</div>`:""}
      <div class="acts"><button class="btn ${done?"undone":"done"}" data-t="${e.id}">${done?"취소":"했어요"}</button>
      ${e.url?`<a class="btn vid" href="${esc(e.url)}" target="_blank" rel="noopener">영상 보기</a>`:""}</div></div>`;}).join("");
  if(edu.length){
    h+=`<h3 class="sec">보호자와 함께 연습할 일상생활 동작</h3>`;
    h+=edu.map(({e})=>`<div class="edu"><h2>${esc(e.name)}</h2><ol>${e.steps.map(s=>`<li>${esc(s)}</li>`).join("")}</ol>
      ${e.carerRole?`<div class="role"><b>보호자가 할 일</b><br>${esc(e.carerRole)}</div>`:""}
      ${e.caution?`<div class="avoid"><b>하지 말아야 할 것</b><br>${esc(e.caution)}</div>`:""}</div>`).join("");
  }
  h+=`<div class="stop">통증, 어지러움, 숨참, 사레가 생기면 바로 멈추고 간호사에게 알리세요.</div>`;
  $("main").innerHTML=h;
  $("foot").innerHTML=`<p>이 화면은 치료사가 만든 운동 목록을 보여줍니다. 수행 표시는 이 휴대폰에만 저장되며 병원으로 전송되지 않습니다.</p>`;
}
document.addEventListener("click",e=>{const b=e.target.closest("[data-t]");if(b)toggle(b.dataset.t);});
render();
// 같은 폴더의 library.json이 있으면 치료사가 고친 설명·횟수·영상 주소를 반영
(async()=>{
  if(!/^https?:$/.test(location.protocol))return;
  try{const r=await fetch("library.json",{cache:"no-store"});if(!r.ok)return;const j=await r.json();
    if(j.app!=="homeprog"||!Array.isArray(j.lib))return;
    const m=Object.fromEntries(j.lib.map(e=>[e.id,e]));
    DEFAULT_LIB.forEach(e=>{const o=m[e.id];if(!o)return;["name","dose","steps","caution","url"].forEach(k=>{if(k in o)e[k]=o[k];});});
    render();}catch{}
})();
</script>
</body>
</html>
