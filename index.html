p.sub{margin:0 0 26px;color:var(--sub);font-size:14.5px}
.cards{display:flex;gap:16px;flex-wrap:wrap;justify-content:center;max-width:860px}
.card{background:#fff;border:1px solid var(--line);border-top:5px solid var(--c);border-radius:16px;padding:22px 24px;width:252px;text-align:left;cursor:pointer;
 font:inherit;color:inherit;transition:transform .1s,box-shadow .15s}
.card:hover{transform:translateY(-2px);box-shadow:0 8px 20px rgba(14,40,70,.1)}
.card b{display:block;font-size:19px;margin-bottom:6px}
.card span{font-size:13.5px;color:var(--sub);line-height:1.5}
.lock{display:block;margin-top:12px;font-size:12px;color:var(--c);font-weight:700}
.card span{display:block}
dialog{border:none;border-radius:16px;padding:24px;max-width:340px;width:90%;box-shadow:0 20px 50px rgba(0,0,0,.25)}
dialog h2{margin:0 0 6px;font-size:18px}
dialog p{margin:0 0 14px;font-size:13.5px;color:var(--sub)}
dialog input{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:10px;font:inherit;margin-bottom:10px}
dialog .err{color:var(--danger);font-size:13px;margin-bottom:10px;display:none}
.row{display:flex;gap:8px;justify-content:flex-end}
button.btn{border:1px solid var(--line);background:#fff;border-radius:10px;padding:9px 16px;font:inherit;cursor:pointer}
button.btn.pri{background:var(--pri);border-color:var(--pri);color:#fff;font-weight:700}
footer{margin-top:26px;color:var(--sub);font-size:12.5px;text-align:center;line-height:1.6}
</style>
</head>

<script>
const $=id=>document.getElementById(id);
// 기본 비밀번호 (관리자 페이지에서 바꾸면 library.json의 값이 우선합니다)
let PW={t:"21eb5d09266b3ccbdcfa9346df9fdeb8a45b109e1b3a7a1271d7f54e865a765c",a:"c4b03d0819930085257e13181af316e75ad1c23b256ad4b0f988a8f8c55f68c3"};
(async()=>{try{const r=await fetch("library.json",{cache:"no-store"});if(!r.ok)return;const j=await r.json();
  if(j&&j.set){if(j.set.pwT)PW.t=j.set.pwT;if(j.set.pwA)PW.a=j.set.pwA;}}catch{}})();
async function sha(t){const b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode("hp:"+t));
  return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join("");}
const PAGE={therapist:{file:"therapist.html",key:"homeprog_gate_t",pw:"t",name:"치료사용"},
            admin:{file:"admin.html",key:"homeprog_gate_a",pw:"a",name:"관리자용"}};
let pending=null;
function open_(p){location.href=p.file;}
document.querySelectorAll("[data-go]").forEach(b=>b.onclick=()=>{
  const k=b.dataset.go;
  if(k==="patient"){location.href="patient.html";return;}
  const p=PAGE[k];
  try{if(localStorage.getItem(p.key)){open_(p);return;}}catch{}
  pending=p;$("dlgTitle").textContent=p.name+" 비밀번호";$("dlgSub").textContent="처음 한 번만 입력하면 이 컴퓨터에서는 다시 묻지 않습니다.";
  $("pw").value="";$("err").style.display="none";$("dlg").showModal();$("pw").focus();
});
$("cancel").onclick=()=>$("dlg").close();
$("ok").onclick=async()=>{
  const v=$("pw").value;
  if(await sha(v)===PW[pending.pw]){try{localStorage.setItem(pending.key,"1");}catch{}$("dlg").close();open_(pending);}
  else{$("err").style.display="block";$("pw").select();}
};
$("pw").addEventListener("keydown",e=>{if(e.key==="Enter")$("ok").click();});
// 비밀번호 없이 치료사·관리자 페이지에 바로 들어오면 여기로 돌아옵니다
const next=new URLSearchParams(location.search).get("next");
if(next&&PAGE[next])setTimeout(()=>document.querySelector(`[data-go="${next}"]`).click(),200);
</script>
</body></html>
